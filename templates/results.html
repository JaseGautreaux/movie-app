<!DOCTYPE html>
<html>
<head>
    <title>Search Results</title>
    <style>
        body {
            font-family: 'Times New Roman', serif;
            background-color: #1a1a2e;
            color: white;
            padding: 50px;
        }
        h1 {
            color: #e94560;
            text-align: center;
        }
        .movie-card {
            background-color: #16213e;
            border-radius: 10px;
            padding: 20px;
            margin: 20px auto;
            max-width: 600px;
        }
        .movie-title {
            color: #e94560;
            font-size: 24px;
            font-weight: bold;
        }
        .back-btn {
            display: block;
            text-align: center;
            color: #e94560;
            text-decoration: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <a class="back-btn" href="/">← Back to Search</a>
    <h1>Results for "{{ query }}"</h1>
    <p style="text-align:center">Found {{ movies|length }} results</p>

    {% for movie in movies %}
    <div class="movie-card">
        <div style="display: flex; gap: 20px; align-items: flex-start"></div>
            {% if movie.poster_path %}
            <img src="https://image.tmdb.org/t/p/w200{{ movie.poster_path }}"
                style="border-radius: 8px; width: 100px; flex-shrink: 0;">
            {% endif %}
            <div>
                <p class="movie-title">{{ movie.title }}</p>
                <p>⭐ Rating: {{ movie.vote_average }}/10</p>
                <p>📅 Release date: {{ movie.release_date }}</p>
                <p>{{ movie.overview }}</p>
                <form action="/favorite/add" method="POST">
                      <input type="hidden" name="title" value="{{ movie.title }}"> 
                      <input type="hidden" name="rating" value="{{ movie.vote_average }}"> 
                      <input type="hidden" name="overview" value="{{ movie.overview }}"> 
                      <input type="hidden" name="poster_path" value="{{ movie.poster_path }}"> 
                      <input type="hidden" name="tmdb_id" value="{{ movie.id }}"> 
                      <button type="submit">&#128525 Save to Favorites</button> 
                </form>
            </div>
        </div>
    </div>
    {% endfor %}

</body>
</html>
